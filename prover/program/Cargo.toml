[package]
name = "zk-tls-program"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-zkvm = { version = "6.0" }

# TLS 1.3 key derivation (patched sha2 uses SHA_EXTEND/SHA_COMPRESS precompiles)
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10.8", default-features = false, features = ["oid"] }

# RSA signature verification (patched rsa uses U256xU2048_MUL precompile)
rsa = "0.9.6"

# Zero-cost type transmutation for precompile data
bytemuck = { version = "1", default-features = false, features = ["derive"] }

# HTTP/JSON parsing
serde_json = { version = "1", default-features = false, features = ["alloc"] }
