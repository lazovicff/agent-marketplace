[package]
name = "zk-tls-program"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-zkvm = { version = "6.0" }

# TLS 1.3 key derivation (patched sha2 uses SHA_EXTEND/SHA_COMPRESS precompiles)
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10.8", default-features = false, features = ["oid"] }

# ECDSA P-256 signature verification for cert chain
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "sha2", "arithmetic"] }
