[package]
name = "tls-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
# TLS
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"

# URL parsing
url = "2"

# Async (for spawn_blocking)
tokio = { version = "1", features = ["rt", "net"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Error handling
anyhow = "1"
